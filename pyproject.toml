[project]
name = "opencode-go-quota-hermes"
version = "0.1.1"
description = "Hermes plugin: OpenCode Go quota tracking, warn/block hooks, postpone skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "timothe" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quota"]
py-modules = ["hooks", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "skills", ".cursor"]
addopts = "--import-mode=importlib"
